services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=local-dev-production-test-secret-key-at-least-50-characters-long
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_URL=postgres://huntly:huntly_secret@db:5432/huntly
      - SECURE_SSL_REDIRECT=False
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=huntly
      - POSTGRES_USER=huntly
      - POSTGRES_PASSWORD=huntly_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huntly -d huntly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
