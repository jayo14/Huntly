services:
  - type: web
    name: huntly
    env: python
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn huntly.wsgi:application
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: huntly.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 20.18.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: huntly-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: huntly-db
    plan: starter
    databaseName: huntly
    user: huntly
