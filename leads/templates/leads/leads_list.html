{% extends "base.html" %}

{% block title %}Applications | Huntly{% endblock %}
{% block header_title %}Job Applications{% endblock %}

{% block content %}
<div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div class="flex flex-1 items-center gap-3">
        <!-- Search Input -->
        <div class="relative flex-1 max-w-md">
            <span class="ms text-xl absolute left-4 top-1/2 -translate-y-1/2 text-mut">search</span>
            <input type="text" name="search" placeholder="Search by role, company, or skills..."
                   class="w-full bg-card border-[1.5px] border-ink rounded-full py-2.5 pl-11 pr-4 text-sm text-ink placeholder:text-mut focus:outline-none focus:ring-2 focus:ring-pink/40 transition-all"
                   hx-get="{% url 'leads:lead-list' %}"
                   hx-trigger="keyup changed delay:400ms"
                   hx-target="#leads-table-container"
                   hx-include="[name='status']">
        </div>

        <!-- Status Filter Select -->
        <div class="relative">
            <select name="status"
                    class="appearance-none bg-card border-[1.5px] border-ink rounded-full py-2.5 pl-4 pr-10 text-sm font-bold text-ink focus:outline-none focus:ring-2 focus:ring-pink/40 cursor-pointer transition-all"
                    hx-get="{% url 'leads:lead-list' %}"
                    hx-target="#leads-table-container"
                    hx-include="[name='search']">
                <option value="">All Statuses</option>
                {% for value, label in status_choices %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
            <span class="ms text-base absolute right-3 top-1/2 -translate-y-1/2 text-ink pointer-events-none">expand_more</span>
        </div>
    </div>

    <!-- Track New Job Button -->
    <button hx-get="{% url 'leads:lead-create' %}" hx-target="#modal-content"
            class="btn">
        <i class="ms">add</i>
        Track New Job
    </button>
</div>

<!-- Table Container -->
<div id="leads-table-container" hx-trigger="leadsChanged from:body" hx-get="{% url 'leads:lead-list' %}" hx-target="this">
    {% include "leads/partials/lead_list_table.html" %}
</div>
{% endblock %}
