<input type="text" name="subject" value="{{ subject }}" id="message-subject" hx-swap-oob="true" class="w-full bg-neutral-800 border border-neutral-700 rounded-md text-sm py-2 px-3 focus:outline-none focus:border-neutral-500">
<textarea name="body" id="message-body" hx-swap-oob="true" rows="10" class="w-full bg-neutral-800 border border-neutral-700 rounded-md text-sm py-2 px-3 focus:outline-none focus:border-neutral-500 resize-none">{{ body }}</textarea>
