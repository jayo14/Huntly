<span id="ats-score-badge" hx-swap-oob="outerHTML" class="px-3 py-1 rounded-full text-xs font-bold border border-ink shadow-sm {% if score >= 80 %}bg-lime text-ink{% elif score >= 50 %}bg-sun text-ink{% else %}bg-card text-mut{% endif %}">
    ATS Match: {{ score }}%
</span>

<div id="matched-keywords-container" hx-swap-oob="outerHTML" class="flex flex-wrap gap-1.5">
    {% for kw in matched_keywords %}
    <span class="ch text-xs py-1 px-3">
        {{ kw }}<span class="ms text-xs">check</span>
    </span>
    {% empty %}
    <span class="text-xs text-mut italic">No specific tech keywords identified.</span>
    {% endfor %}
</div>

<textarea id="tailored-bullets-text" hx-swap-oob="outerHTML" rows="11" readonly
          class="w-full bg-[#f4f8f1] border-[1.5px] border-ink rounded-2xl p-4 text-xs font-mono text-ink leading-relaxed resize-none focus:outline-none">{{ tailored_resume_text }}</textarea>

<textarea id="cover-letter-text" hx-swap-oob="outerHTML" rows="12" readonly
          class="w-full bg-[#f4f8f1] border-[1.5px] border-ink rounded-2xl p-4 text-xs font-sans text-ink leading-relaxed resize-none focus:outline-none">{{ cover_letter }}</textarea>

<input type="text" name="subject" value="{{ subject }}" id="message-subject" hx-swap-oob="outerHTML"
       class="w-full bg-card border-[1.5px] border-ink rounded-xl text-xs py-2.5 px-3 text-ink font-semibold focus:outline-none focus:ring-2 focus:ring-pink/40">

<textarea name="body" id="message-body" hx-swap-oob="outerHTML" rows="7"
          class="w-full bg-card border-[1.5px] border-ink rounded-xl text-xs py-3 px-3.5 text-ink focus:outline-none focus:ring-2 focus:ring-pink/40 resize-none font-sans leading-relaxed">{{ body }}</textarea>
